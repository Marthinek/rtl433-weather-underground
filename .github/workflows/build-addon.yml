name: Build add-on

on:
  push:
    paths:
      - "rtl433_wunderground/**"
      - ".github/workflows/build-addon.yml"
  pull_request:
    paths:
      - "rtl433_wunderground/**"
      - ".github/workflows/build-addon.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile rtl433_wunderground/run.py
      - name: Validate YAML files
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import yaml
          for name in ("repository.yaml", "rtl433_wunderground/config.yaml", "rtl433_wunderground/build.yaml"):
              with open(name, encoding="utf-8") as f:
                  yaml.safe_load(f)
              print("OK:", name)
          PY
