name: Validate and build add-on

on:
  push:
    paths:
      - "rtl433_wunderground/**"
      - ".github/workflows/build-addon.yml"
  pull_request:
    paths:
      - "rtl433_wunderground/**"
      - ".github/workflows/build-addon.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install PyYAML paho-mqtt requests
      - name: Check Python syntax
        run: python -m py_compile rtl433_wunderground/run.py
      - name: Validate YAML files
        run: |
          python - <<'PY'
          import yaml
          for name in ("repository.yaml", "rtl433_wunderground/config.yaml", "rtl433_wunderground/build.yaml"):
              with open(name, encoding="utf-8") as f:
                  yaml.safe_load(f)
              print("OK:", name)
          PY
      - name: Verify unit conversions
        run: |
          python - <<'PY'
          import importlib.util, json, os, tempfile
          from pathlib import Path
          # Import is tested using a temporary add-on options file.
          options_path = Path("test-options.json")
          options_path.write_text(json.dumps({
              "station_id":"TEST", "station_key":"not-a-real-key",
              "temperature_field":"temperature_C","temperature_unit":"C",
              "humidity_field":"humidity",
              "pressure_field":"pressure_hPa","pressure_unit":"hPa",
              "wind_speed_field":"wind_kmh","wind_speed_unit":"km/h",
              "wind_gust_field":"","wind_direction_field":"wind_dir",
              "rain_hour_field":"","rain_day_field":""
          }))
          import os
          os.environ["WU_OPTIONS_PATH"] = str(options_path)
          spec=importlib.util.spec_from_file_location("wu", "rtl433_wunderground/run.py")
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          result=mod.build_wu_params({
              "temperature_C":20, "humidity":50, "pressure_hPa":1013.25,
              "wind_kmh":10, "wind_dir":370
          })
          assert abs(float(result["tempf"])-68)<0.01, result
          assert result["humidity"]=="50", result
          assert abs(float(result["baromin"])-29.92)<0.03, result
          assert abs(float(result["windspeedmph"])-6.21)<0.02, result
          assert result["winddir"]=="10", result
          print("Unit conversion smoke test passed")
          PY
      - name: Build add-on image for the runner architecture
        run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.12 -t rtl433-wu-test ./rtl433_wunderground
